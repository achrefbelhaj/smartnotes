# ---------- Serveur ----------
server.port=8080

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/smartnotes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
# Pas de valeur par défaut : DB_PASSWORD est obligatoire
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- JWT ----------
# Pas de valeur par défaut : JWT_SECRET est obligatoire (minimum 32 caractères)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ---------- Gemini ----------
# Optionnelle au démarrage : seul le bouton "Résumer" échouera sans elle
gemini.api.key=${GEMINI_API_KEY:}
